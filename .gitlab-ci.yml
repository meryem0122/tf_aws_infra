stages:
  - validate
  - plan
  - apply

variables:
  TF_VERSION: "1.9.0"

image:
  name: hashicorp/terraform:${TF_VERSION}
  entrypoint: [""]

fmt_check:
  stage: validate
  script:
    - terraform fmt -check -recursive
  allow_failure: false

validate:
  stage: validate
  script:
    - terraform init
    - terraform validate

plan:
  stage: plan
  script:
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

apply:
  stage: apply
  script:
    - terraform init
    - terraform apply -auto-approve tfplan
  dependencies:
    - plan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual